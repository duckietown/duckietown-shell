name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g., v1.2.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DTS_RELEASE_PUBLIC_KEY: ${{ vars.DTS_RELEASE_PUBLIC_KEY }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag such as v6.2.28."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
          - runner: windows-2022
            arch: AMD64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tools
        run: python -m pip install -r requirements-release.txt
      - name: Set package version
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: python -m bumpversion --new-version "$env:RELEASE_VERSION" --allow-dirty --no-commit --no-tag patch
        if: runner.os == 'Windows'
      - name: Set package version
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: python -m bumpversion --new-version "$RELEASE_VERSION" --allow-dirty --no-commit --no-tag patch
        if: runner.os != 'Windows'
      - name: Build and repair native wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.runner }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  seal:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-release.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
          path: wheelhouse
          merge-multiple: true
      - name: Sign repaired wheels
        env:
          DTS_RELEASE_SIGNING_KEY: ${{ secrets.DTS_RELEASE_SIGNING_KEY }}
        run: python tools/release.py seal wheelhouse --version "${{ needs.resolve.outputs.version }}"
      - name: Validate complete signed release
        run: python tools/release.py verify wheelhouse --require-matrix --version "${{ needs.resolve.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  test:
    needs: [resolve, seal]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-release.txt
      - uses: actions/download-artifact@v4
        with:
          name: signed-wheels
          path: wheelhouse
      - name: Install matching signed wheel
        run: python tools/release.py install wheelhouse --version "${{ needs.resolve.outputs.version }}"
      - name: Test installed native runtime and tamper detection
        run: python -m unittest discover -s lib/dt_shell_tests -p "test_release_runtime.py" -v
      - name: Test authorization and device behavior in native modules
        run: |
          python -m unittest discover -s lib/dt_shell_tests -p "test_authorization.py"
          python -m unittest discover -s lib/dt_shell_tests -p "test_device.py"
      - name: Test release artifact validation and platform adapters
        run: |
          python -m unittest discover -s lib/dt_shell_tests -p "test_release_tools.py"
          python -m unittest discover -s lib/dt_shell_tests -p "test_platform_environments.py"

  deploy:
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-release.txt
      - uses: actions/download-artifact@v4
        with:
          name: signed-wheels
          path: dist
      - name: Publish only verified signed native wheels
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python tools/release.py publish dist --version "${{ needs.resolve.outputs.version }}"
