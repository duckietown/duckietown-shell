name: Build native Duckiematrix Engine guards

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Approved full shell commit to release
        required: true

permissions:
  contents: read

env:
  DTS_RELEASE_PUBLIC_KEY: ${{ vars.DTS_RELEASE_PUBLIC_KEY }}
  DTS_COMMANDS_PUBLIC_KEY: ${{ vars.DTS_COMMANDS_PUBLIC_KEY }}
  DTS_DEVELOPER_PUBLIC_KEYS: ${{ vars.DTS_DEVELOPER_PUBLIC_KEYS }}
  DTM_RELEASE_PUBLIC_KEY: ${{ vars.DTM_RELEASE_PUBLIC_KEY }}
  DTM_RENDERER_PUBLIC_KEYS: ${{ vars.DTM_RENDERER_PUBLIC_KEYS }}
  DTV_RELEASE_PUBLIC_KEY: ${{ vars.DTV_RELEASE_PUBLIC_KEY }}
  DTV_AUTH_PUBLIC_KEYS: ${{ vars.DTV_AUTH_PUBLIC_KEYS }}
  DTM_ENGINE_RELEASE_PUBLIC_KEY: ${{ vars.DTM_ENGINE_RELEASE_PUBLIC_KEY }}
  DTM_ENGINE_PUBLIC_KEYS: ${{ vars.DTM_ENGINE_PUBLIC_KEYS }}

jobs:
  build:
    environment: engine-build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require an approved immutable revision
        shell: bash
        env:
          APPROVED_REF: ${{ inputs.ref }}
        run: '[[ "$APPROVED_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and repair a native Linux wheel
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          arch="$(uname -m)"
          docker run --rm -v "$PWD:/project" -w /project \
            -e DTS_RELEASE_PUBLIC_KEY -e DTS_COMMANDS_PUBLIC_KEY -e DTS_DEVELOPER_PUBLIC_KEYS \
            -e DTM_RELEASE_PUBLIC_KEY -e DTM_RENDERER_PUBLIC_KEYS \
            -e DTV_RELEASE_PUBLIC_KEY -e DTV_AUTH_PUBLIC_KEYS \
            -e DTM_ENGINE_RELEASE_PUBLIC_KEY -e DTM_ENGINE_PUBLIC_KEYS \
            -e PYTHON_VERSION \
            "quay.io/pypa/manylinux2014_${arch}" bash -ec '
              case "$PYTHON_VERSION" in
                3.10) python=/opt/python/cp310-cp310/bin/python ;;
                3.11) python=/opt/python/cp311-cp311/bin/python ;;
                3.12) python=/opt/python/cp312-cp312/bin/python ;;
                *) exit 1 ;;
              esac
              "$python" -m pip install -r tools/engine_guard/requirements-build.txt
              "$python" tools/engine_guard/setup.py bdist_wheel --dist-dir engine-guard-dist
              "$python" -m auditwheel repair engine-guard-dist/*.whl --wheel-dir engine-guard-wheels
            '
      - name: Verify the exact compiled guard and shared protocol
        run: |
          python -m pip install engine-guard-wheels/*.whl
          python -m pip install -r lib/dt_shell/assets/requirements.txt
          python -c 'import json, os, duckietown_engine_guard as g; assert g.native_trust() == (os.environ["DTM_ENGINE_RELEASE_PUBLIC_KEY"], json.loads(os.environ["DTM_ENGINE_PUBLIC_KEYS"]))'
          PYTHONPATH=lib python -m unittest dt_shell_tests.test_engine dt_shell_tests.test_engine_native dt_shell_tests.test_viewer
      - uses: actions/upload-artifact@v4
        with:
          name: engine-guard-${{ matrix.runner }}-${{ matrix.python }}
          path: engine-guard-wheels/*.whl
          if-no-files-found: error

  publish:
    needs: build
    environment: engine-guard-pypi
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-guard-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
